name: One-time Retail Mind production patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[retail-mind-patch-done]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/payment_detection_service.dart')
          s = p.read_text(encoding='utf-8')

          old_bill = '''    if (diff <= tol)                          return BillMatchResult.exact;
    if (detected >= remaining * 0.5 &&
        detected  < remaining - tol)          return BillMatchResult.partial;
    if (detected  > expectedAmount! * 2.0)    return BillMatchResult.suspicious;
    return BillMatchResult.mismatch;'''
          new_bill = '''    // Business rule: exact means the payment equals the remaining balance.
    // Any positive payment below the remaining balance is a valid partial payment.
    // Do not impose a percentage floor: ₹2 against ₹10 is still a valid partial.
    if ((detected - remaining).abs() <= 0.01) return BillMatchResult.exact;
    if (detected > 0 && detected < remaining) return BillMatchResult.partial;
    if (detected > expectedAmount! * 2.0) return BillMatchResult.suspicious;
    return BillMatchResult.mismatch;'''
          if old_bill not in s:
              raise SystemExit('BillMatchResult block not found')
          s = s.replace(old_bill, new_bill, 1)

          # Add a resilient SMS inbox fallback. The normal broadcast listener remains
          # primary; this only catches OEM/Truecaller/SMS-app cases where the callback
          # is missed while the message is already present in the device inbox.
          import_line = "import 'session_management.dart';"
          fallback_import = import_line + "\nimport 'payment_sms_fallback_service.dart';"
          if fallback_import not in s:
              if import_line not in s:
                  raise SystemExit('session_management import not found')
              s = s.replace(import_line, fallback_import, 1)

          field_anchor = '  final List<String> _processedSmsCache = [];'
          field_replacement = field_anchor + "\n  final PaymentSmsFallbackService _smsFallback = PaymentSmsFallbackService();"
          if '_smsFallback' not in s:
              if field_anchor not in s:
                  raise SystemExit('SMS cache field not found')
              s = s.replace(field_anchor, field_replacement, 1)

          start_anchor = '    await _startSmsListener();'
          start_replacement = start_anchor + '\n    await _smsFallback.start(handleSms);'
          if 'await _smsFallback.start(handleSms);' not in s:
              if start_anchor not in s:
                  raise SystemExit('SMS start anchor not found')
              s = s.replace(start_anchor, start_replacement, 1)

          dispose_anchor = '    await _notifSub?.cancel();'
          dispose_replacement = '    await _smsFallback.dispose();\n    ' + dispose_anchor.strip()
          if 'await _smsFallback.dispose();' not in s:
              if dispose_anchor not in s:
                  raise SystemExit('dispose anchor not found')
              s = s.replace(dispose_anchor, dispose_replacement, 1)

          p.write_text(s, encoding='utf-8')

          fallback = Path('lib/payment_sms_fallback_service.dart')
          fallback.write_text(r'''import 'dart:async';
import 'package:telephony/telephony.dart';

/// OEM-safe fallback for devices that deliver the SMS broadcast but do not
/// reliably invoke the foreground telephony callback. The normal listener is
/// still the primary path; this service only reads recent inbox messages and
/// feeds unseen messages into the same payment parser.
class PaymentSmsFallbackService {
  Timer? _timer;
  bool _running = false;
  final Set<String> _seen = <String>{};
  Future<void> Function(String sender, String body)? _handler;

  Future<void> start(FutureOr<void> Function(String sender, String body) handler) async {
    _handler = (String sender, String body) async => await handler(sender, body);
    if (_running) return;
    _running = true;
    await _poll();
    _timer?.cancel();
    _timer = Timer.periodic(const Duration(seconds: 5), (_) => _poll());
  }

  Future<void> _poll() async {
    if (!_running || _handler == null) return;
    try {
      final allowed = await Telephony.instance.requestSmsPermissions ?? false;
      if (!allowed) return;
      final messages = await Telephony.instance.getInboxSms(
        columns: [SmsColumn.ID, SmsColumn.ADDRESS, SmsColumn.BODY, SmsColumn.DATE],
      );
      for (final message in messages.take(20)) {
        final sender = (message.address ?? '').trim();
        final body = (message.body ?? '').trim();
        if (sender.isEmpty || body.isEmpty) continue;
        final id = '${message.id ?? ''}|${message.date ?? ''}|$sender|$body';
        if (!_seen.add(id)) continue;
        if (_seen.length > 200) {
          _seen.remove(_seen.first);
        }
        await _handler!(sender, body);
      }
    } catch (_) {
      // Broadcast listener remains authoritative; polling is only a recovery path.
    }
  }

  Future<void> dispose() async {
    _running = false;
    _timer?.cancel();
    _timer = null;
    _handler = null;
    _seen.clear();
  }
}
''', encoding='utf-8')

          wf = Path('.github/workflows/one_time_retail_mind_patch.yml')
          if wf.exists():
              wf.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/payment_detection_service.dart lib/payment_sms_fallback_service.dart .github/workflows/one_time_retail_mind_patch.yml
          git commit -m 'fix: payment SMS fallback and partial matching [retail-mind-patch-done]'
          git push